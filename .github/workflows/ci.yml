name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  PAPER_VERSION: "1.21.1"
  PAPER_BUILD: "4"
  PAPER_JAR_SHA: "439a12a84b57f5660116cbfa29b9dd078b5c0013ad0f826938391e61dcb"
  VAULT_URL: "https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CoinOp
          path: target/*.jar

  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download CoinOp
        uses: actions/download-artifact@v4
        with:
          name: CoinOp
          path: plugins
      - name: Download Vault (softdep)
        run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-${{ env.PAPER_VERSION }}-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          ls -lh paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Start Paper server
        run: |
          echo "eula=true" > eula.txt
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started successfully!"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          SMOKE_FAIL=0
          if grep -q "CoinOp" logs/latest.log 2>/dev/null; then
            if grep -qi "exception.*CoinOp\|error.*CoinOp" logs/latest.log 2>/dev/null; then
              REAL_ERR=$(grep -i "exception.*CoinOp\|error.*CoinOp" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART" || true)
              if [ -n "$REAL_ERR" ]; then
                echo "FAIL: CoinOp exceptions during runtime"
                echo "$REAL_ERR"
                SMOKE_FAIL=1
              else
                echo "PASS: CoinOp loaded without fatal errors"
              fi
            else
              echo "PASS: CoinOp loaded without errors"
            fi
          else
            echo "FAIL: CoinOp not found in server log"
            SMOKE_FAIL=1
          fi
          if [ -d "plugins/CoinOp" ]; then
            echo "PASS: CoinOp plugin directory exists"
          else
            echo "FAIL: CoinOp plugin directory not created"
            SMOKE_FAIL=1
          fi
          if [ -f "plugins/CoinOp/config.yml" ]; then
            echo "PASS: config.yml generated"
          else
            echo "FAIL: config.yml not generated"
            SMOKE_FAIL=1
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$SMOKE_FAIL" -ne 0 ]; then
            echo "SMOKE TEST FAILED ($SMOKE_FAIL check(s) failed)"
            exit 1
          else
            echo "ALL SMOKE CHECKS PASSED"
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: logs/latest.log
          retention-days: 7

  mysql-test:
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: coinop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download CoinOp
        uses: actions/download-artifact@v4
        with:
          name: CoinOp
          path: plugins
      - name: Download Vault
        run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar
      - name: Download Paper
        run: |
          PAPER_URL="https://fill-data.papermc.io/v1/objects/${{ env.PAPER_JAR_SHA }}/paper-${{ env.PAPER_VERSION }}-${{ env.PAPER_BUILD }}.jar"
          curl -sL "$PAPER_URL" -o paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Start server with MySQL enabled
        run: |
          mkdir -p plugins/CoinOp
          cat > plugins/CoinOp/config.yml << 'CFG'
          economy:
            type: mysql
            mysql:
              host: 127.0.0.1
              port: 3306
              database: coinop_test
              username: root
              password: test
          CFG
          echo "eula=true" > eula.txt
          echo "online-mode=false" >> server.properties
          echo "enable-rcon=true" >> server.properties
          echo "rcon.port=25575" >> server.properties
          echo "rcon.password=test" >> server.properties
          timeout 120 java -jar paper.jar --nogui &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started with MySQL!"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "Server failed to start with MySQL"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          MYSQL_FAIL=0
          if grep -q "CoinOp" logs/latest.log 2>/dev/null; then
            if grep -qi "exception.*CoinOp\|error.*CoinOp" logs/latest.log 2>/dev/null; then
              REAL_ERR=$(grep -i "exception.*CoinOp\|error.*CoinOp" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART" || true)
              if [ -n "$REAL_ERR" ]; then
                echo "FAIL: CoinOp exceptions with MySQL"
                echo "$REAL_ERR"
                MYSQL_FAIL=1
              fi
            fi
          fi
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          if [ "$MYSQL_FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-log
          path: logs/latest.log
          retention-days: 7

  code-quality:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build and check
        run: mvn verify
