name: Multi-Version In-Game Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  VAULT_URL: "https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar"
  VIAVERSION_URL: "https://cdn.modrinth.com/data/P1OZGk5p/versions/6LC4R0sP/ViaVersion-5.9.2-SNAPSHOT.jar"
  VIABACKWARDS_URL: "https://cdn.modrinth.com/data/NpvuJQoq/versions/Og77hOkC/ViaBackwards-5.9.2-SNAPSHOT.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build all versions
        run: ./gradlew shadowJar --no-daemon --stacktrace
      - name: Upload 1.19.4 JAR
        uses: actions/upload-artifact@v4
        with:
          name: coinop-1.19.4
          path: versions/1.19.4/build/libs/*.jar
      - name: Upload 1.20.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: coinop-1.20.1
          path: versions/1.20.1/build/libs/*.jar
      - name: Upload 1.20.4 JAR
        uses: actions/upload-artifact@v4
        with:
          name: coinop-1.20.4
          path: versions/1.20.4/build/libs/*.jar
      - name: Upload 1.20.6 JAR
        uses: actions/upload-artifact@v4
        with:
          name: coinop-1.20.6
          path: versions/1.20.6/build/libs/*.jar
      - name: Upload 1.21 JAR
        uses: actions/upload-artifact@v4
        with:
          name: coinop-1.21
          path: versions/1.21/build/libs/*.jar
      - name: Upload 1.21.11 JAR
        uses: actions/upload-artifact@v4
        with:
          name: coinop-1.21.11
          path: versions/1.21.11/build/libs/*.jar

  version-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc_version: "1.19.4"
            java_version: "17"
            artifact_name: "coinop-1.19.4"
            needs_via: "false"
          - mc_version: "1.20.1"
            java_version: "17"
            artifact_name: "coinop-1.20.1"
            needs_via: "false"
          - mc_version: "1.20.4"
            java_version: "17"
            artifact_name: "coinop-1.20.4"
            needs_via: "false"
          - mc_version: "1.20.6"
            java_version: "21"
            artifact_name: "coinop-1.20.6"
            needs_via: "true"
          - mc_version: "1.21"
            java_version: "21"
            artifact_name: "coinop-1.21"
            needs_via: "true"
          - mc_version: "1.21.1"
            java_version: "21"
            artifact_name: "coinop-1.21.11"
            needs_via: "true"
    name: "Test MC ${{ matrix.mc_version }}"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.java_version }}'
          distribution: 'temurin'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download CoinOp JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: plugins
      - name: Download Paper ${{ matrix.mc_version }}
        run: |
          PAPER_API="https://api.papermc.io/v2/projects/paper/versions/${{ matrix.mc_version }}/builds"
          echo "Fetching Paper builds from API..."
          LATEST_BUILD=$(curl -sL "$PAPER_API" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          builds = data.get('builds', [])
          release_builds = [b for b in builds if b.get('channel') == 'default']
          if not release_builds:
              release_builds = builds
          latest = release_builds[-1]
          build_num = latest['build']
          downloads = latest.get('downloads', {}).get('application', {})
          filename = downloads.get('name', 'paper-${{ matrix.mc_version }}-' + str(build_num) + '.jar')
          print(str(build_num) + '|' + filename)
          ")
          BUILD_NUM=$(echo "$LATEST_BUILD" | cut -d'|' -f1)
          FILENAME=$(echo "$LATEST_BUILD" | cut -d'|' -f2)
          PAPER_URL="https://api.papermc.io/v2/projects/paper/versions/${{ matrix.mc_version }}/builds/${BUILD_NUM}/downloads/${FILENAME}"
          echo "Downloading Paper ${{ matrix.mc_version }} build ${BUILD_NUM}"
          curl -sLf "$PAPER_URL" -o paper.jar
          ls -lh paper.jar
          if [ ! -s paper.jar ]; then
            echo "FAIL: paper.jar is empty or missing"
            exit 1
          fi
      - name: Download Vault
        run: curl -sL "${{ env.VAULT_URL }}" -o plugins/Vault.jar || true
      - name: Download ViaVersion
        if: matrix.needs_via == 'true'
        run: |
          curl -sL "${{ env.VIAVERSION_URL }}" -o plugins/ViaVersion.jar || true
          curl -sL "${{ env.VIABACKWARDS_URL }}" -o plugins/ViaBackwards.jar || true
      - name: Configure and start server
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties << 'SPROPS'
online-mode=false
server-port=25565
max-players=10
gamemode=survival
difficulty=peaceful
enable-rcon=true
rcon.port=25575
rcon.password=test
SPROPS
          java -Xmx2G -jar paper.jar --nogui &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 180); do
            if grep -q "Done (" logs/latest.log 2>/dev/null; then
              echo "Server started successfully!"
              break
            fi
            sleep 2
          done
          if ! grep -q "Done (" logs/latest.log 2>/dev/null; then
            echo "FAIL: Server did not start within 6 minutes"
            cat logs/latest.log 2>/dev/null | tail -50 || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
      - name: Op bot via RCON
        run: |
          sleep 5
          python3 ci/rcon_helper.py 127.0.0.1 25575 test "op TestBot"
      - name: Install mineflayer and run tests
        env:
          MC_VERSION: "${{ matrix.mc_version }}"
          NEEDS_VIA: "${{ matrix.needs_via }}"
        run: |
          node -e "
          const fs = require('fs');
          let test = fs.readFileSync('mineflayer_test.js', 'utf8');
          test = test.replace(/const MC_VERSION = '1.21.11';/, 'const MC_VERSION = \'' + process.env.MC_VERSION + '\';');
          const viaLabel = process.env.NEEDS_VIA === 'true'
            ? 'Paper ' + process.env.MC_VERSION + ' / ViaVersion'
            : 'Paper ' + process.env.MC_VERSION + ' (native)';
          test = test.replace(/Paper 1.21.11 \/ ViaVersion/, viaLabel);
          fs.writeFileSync('mineflayer_test_patched.js', test);
          "
          npm install mineflayer
          node mineflayer_test_patched.js 2>&1 | tee mineflayer-output.log
          TEST_EXIT=${PIPESTATUS[0]}
          echo "Mineflayer test exit code: $TEST_EXIT"
          exit $TEST_EXIT
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mineflayer-output-${{ matrix.mc_version }}
          path: mineflayer-output.log
          retention-days: 7
      - name: Dump server exceptions
        if: always()
        run: |
          if [ -f logs/latest.log ]; then
            echo "=== Server exceptions ==="
            grep -iE "exception|error.*coinop|severe" logs/latest.log | grep -vi "vault\|registration attempt\|PLEASE RESTART\|io_uring\|Loading libraries\|com.destroystokyo" | head -30 || echo "No relevant exceptions found"
          fi
      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
          fi
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.mc_version }}
          path: logs/latest.log
          retention-days: 7
