plugins {
    id 'java'
    id 'io.github.goooler.shadow'
}

group = 'com.coinop'
version = '1.21-1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://s01.oss.sonatype.org/content/repositories/releases/' }
    mavenCentral()
}

dependencies {
    // Paper API 1.21
    compileOnly 'io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT'
    // VaultAPI (bukkit excluded to avoid conflict with Paper)
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }
}

sourceSets {
    main {
        java {
            srcDirs = [ '../../src/main/java', 'src/main/java' ]
        }
        resources {
            srcDirs = ['../../src/main/resources']
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    expand project.properties
    filteringCharset = 'UTF-8'
}

tasks.build {
    dependsOn(tasks.shadowJar)
}

shadowJar {
    archiveBaseName.set('coinop-plugin-1.21')
    archiveClassifier.set('')
    archiveVersion.set('1.0.0-SNAPSHOT')
    // Relocate dependencies to avoid conflicts
    relocate 'redis.clients', 'com.coinop.lib.jedis'
    relocate 'com.zaxxer.hikari', 'com.coinop.lib.hikari'
    relocate 'com.mysql', 'com.coinop.lib.mysql'
    relocate 'org.sqlite', 'com.coinop.lib.sqlite'
    relocate 'com.google.gson', 'com.coinop.lib.gson'
    // Do NOT minimize - strips SQLite JDBC native .so libraries
}

tasks.jar {
    enabled = false
}
